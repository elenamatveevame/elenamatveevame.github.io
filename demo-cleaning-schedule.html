<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="utf-8">

<style>
/* Layout: a corridor noticeboard. Header with language + tabs, one working column; room codes set like door plates. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#16211D; --muted:#5B6963; --line:#D8E0DA; --tint:#E8EEEA;
  --accent:#0E6A58; --accent-ink:#FFFFFF; --mark:#FBE38A; --mark-ink:#3A2E00;
  --warn:#B3402A; --warn-bg:#FBE8E3; --ok:#1F7A45; --ok-bg:#E2F3E8;
  --f-display:"Bricolage Grotesque","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#16201B; --ink:#E6EEE9; --muted:#9AABA3; --line:#2A3631; --tint:#1B2621;
  --accent:#52C4A8; --accent-ink:#05251D; --mark:#5A480C; --mark-ink:#FCE9A6;
  --warn:#F0896F; --warn-bg:#3A1C15; --ok:#7FD6A0; --ok-bg:#15301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#16201B; --ink:#E6EEE9; --muted:#9AABA3; --line:#2A3631; --tint:#1B2621;
  --accent:#52C4A8; --accent-ink:#05251D; --mark:#5A480C; --mark-ink:#FCE9A6;
  --warn:#F0896F; --warn-bg:#3A1C15; --ok:#7FD6A0; --ok-bg:#15301F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.code{font-family:var(--f-code);font-size:.86em;font-weight:500;white-space:nowrap}
.plate{font-family:var(--f-code);font-weight:500;font-size:.85em;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:1px 6px;white-space:nowrap}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.demo{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:.85rem;background:var(--tint);border-radius:8px;padding:8px 12px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--ink);font-size:.85rem}

nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:500;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

.roompick{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.roompick select{font-family:var(--f-code);font-weight:500;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}

.next{display:flex;gap:16px;align-items:center}
.cal{flex:none;width:64px;border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:center;background:var(--surface)}
.cal .m{background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 0}
.cal .d{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.2}
.cal .w{font-size:.75rem;color:var(--muted);padding-bottom:4px}

ul.duties{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.duties li{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
ul.duties li:first-child{border-top:0}
ul.duties li.past{opacity:.5}
.dlabel{font-weight:600;font-variant-numeric:tabular-nums}
.dlabel .w{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{font-size:.75rem;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.neutral{background:var(--tint);color:var(--muted)}
.chip.mark{background:var(--mark);color:var(--mark-ink)}
.actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media (max-width:480px){ul.duties li{grid-template-columns:4.5rem minmax(0,1fr)} .actions{grid-column:2;justify-content:flex-start}}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 12px;font-size:.88rem;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:none;text-decoration:underline;padding-inline:4px}

.days{display:flex;flex-wrap:wrap;gap:6px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;min-width:3rem;font-size:.88rem}
.days button[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:600;text-decoration:line-through}

.req{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.req.open{border-color:var(--accent)}
.reqtop{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.rota{border-collapse:collapse;width:100%;min-width:760px;font-size:.85rem}
.rota th,.rota td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.rota thead th{position:sticky;top:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.8rem;white-space:nowrap}
.rota tbody th{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.rota tbody th .w{font-weight:400;color:var(--muted);margin-inline-start:4px}
.rota tr.we{background:var(--tint)}
.rota tr.past{opacity:.45}
.rota tr.today th{box-shadow:inset 3px 0 0 var(--accent)}
.rota mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 3px}
.rota .sw{text-decoration:underline dotted;text-underline-offset:3px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);align-items:center}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.stat .n{font-family:var(--f-display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat.good .n{color:var(--ok)}
.stat.bad .n{color:var(--warn)}
@media (max-width:480px){.stats{grid-template-columns:minmax(0,1fr)}}
.loads{display:flex;flex-wrap:wrap;gap:6px}
.load{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-size:.8rem}
.load b{font-variant-numeric:tabular-nums}
ul.rules{margin:0;padding-inline-start:1.2em;display:flex;flex-direction:column;gap:2px}
ul.unav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.unav li{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:420px;background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;font-weight:500;text-align:center}
.empty{color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.btn,.days button,.opt{transition:border-color .15s,background .15s}}

body{margin:0}[hidden]{display:none!important}
.hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg button:disabled{opacity:.35;cursor:default}
.actions.start{justify-content:flex-start}
.narrow{max-width:420px}
#code{font-family:var(--f-code);padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:9rem}
#watext{width:100%;height:8rem;font-family:var(--f-code);font-size:.8rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px}
mark.lg{background:var(--mark);color:var(--mark-ink);padding:0 4px;border-radius:3px}
.legend .sw{text-decoration:underline dotted;text-underline-offset:3px}
#app.busy{cursor:progress}
#app.busy .btn,#app.busy .days button{opacity:.7}
.btn:disabled{opacity:.5;cursor:default}

.lead{font-size:1.05rem;max-width:60ch}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.choices{grid-template-columns:minmax(0,1fr)}}
.choice{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--bg);text-align:start;min-width:0}
.staffbtn{cursor:pointer;font:inherit;color:inherit}
.staffbtn strong{font-family:var(--f-display);font-size:1.05rem}
.staffbtn:hover{border-color:var(--accent)}
.roompick.big select{font-size:1.05rem;padding:8px 12px;border-width:2px;border-color:var(--accent)}
ol.how{margin:0;padding-inline-start:1.3em;display:flex;flex-direction:column;gap:6px}
details.help{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 12px}
details.help>summary{cursor:pointer;font-weight:600}
details.help[open]>summary{margin-bottom:8px}
details.help .tablewrap{margin-block:8px}
pre.invite{white-space:pre-wrap;font-family:var(--f-body);font-size:.85rem;margin:0;background:var(--bg);border-radius:6px;padding:10px}
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:10px 14px}
.banner.turn{background:var(--mark);color:var(--mark-ink)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.step{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.num{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--accent);color:var(--accent-ink)}
.step.done .num{background:var(--ok-bg);color:var(--ok)}
.stepbody{display:flex;flex-direction:column;gap:10px;min-width:0}
.steptop{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.bar{height:8px;border-radius:999px;background:var(--tint);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.okline{color:var(--ok);font-weight:600}
.confirm{border:1px solid var(--warn);background:var(--warn-bg);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
ul.swaplog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
a.btn{text-decoration:none;color:inherit;display:inline-block}
a.btn.primary{color:var(--accent-ink)}
table.edit{border-collapse:collapse;width:100%;min-width:640px;font-size:.85rem}
table.edit th{text-align:start;font-weight:600;color:var(--muted);padding:4px 6px;font-size:.78rem}
table.edit td{padding:4px 6px;vertical-align:middle}
table.edit input,table.edit select{width:100%;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
table.edit input.short{width:6rem}
.stat .small:last-child{margin-top:2px}

.bulk{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bulk textarea,#newfloor,#floorsel{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.bulk textarea{font-family:var(--f-code);font-size:.85rem;width:100%}
#newfloor{min-width:0;flex:1 1 12rem}
ul.unav li .btn.ghost{margin-inline-start:auto}
</style>

 const days={};v.slice(1).forEach(r=>{const s=[];cols.forEach(c=>{const p=String(r[c.col-1]||'').split('+').map(x=>x.trim());for(let k=0;k<c.n;k++)s.push(p[k]||'');});days[r[0]]=s;});return {cols,days};}
function writeSlot(tab,mon,d,s){let o=0;mon.cols.forEach(c=>{if(s>=o&&s<o+c.n){const row=sheets[tab].find(r=>r[0]===d);row[c.col-1]=mon.days[d].slice(o,o+c.n).filter(Boolean).join(' + ');}o+=c.n;});}

 const m=ms.includes(k)?readMonth(tab,ts):{cols:ts.map(t=>({nl:t.nl,en:t.en,ar:t.ar,n:t.n})),days:{}};const sw=swaps.filter(x=>x.key===tab);

const fail=c=>{throw new Error(c);};const auth=c=>{if(c!=='12345')fail('auth');};
window.__sheets=sheets;window.__rooms=()=>rooms;
const api={getState:(f,k)=>st(f,k),
 setUnavail:(u,d)=>{unav[u]=d;if(!responded.includes(u))responded.push(u);return J(unav);},
 requestSwap:(f,k,u,d,s)=>{const m=readMonth(f+' '+k,tasks.filter(t=>t.f===f));if(m.days[d][s]!==u)fail('stale');swaps.push({id:'x'+(++n),key:f+' '+k,unit:u,d,s,status:'open'});return st(f,k);},

window.google={script:{get run(){return runner(null,null);}}};

 const cell=(d,i)=>{const out=[];for(let k=0;k<cols[i].n;k++)out.push(one(d,L.st[i]+k));return out.join(" + ");};
 let h=`<div class="tablewrap"><table class="rota"><thead><tr><th>${esc(t("date"))}</th>${cols.map(c=>`<th>${esc(label(c))}</th>`).join("")}</tr></thead><tbody>`;

  const past=live&&isPast(d), today=live&&D.key===D.today.key&&d===D.today.day;
  h+=`<tr class="${w>=5?"we":""} ${past?"past":""} ${today?"today":""}"><th>${d} ${esc(MS[P.lang][m])}<span class="w">${esc(WD[P.lang][w])}</span></th>${cols.map((c,i)=>`<td>${cell(d,i)}</td>`).join("")}</tr>`;});

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
// The month staff work on: the month after today, unless a later one is already published and still in the future.
function targetKey(){const now=ym(D.today.key);return now.m===11?keyOf(now.y+1,0):keyOf(now.y,now.m+1);}
function generate(){
 const key=targetKey(), {y,m}=ym(key), n=dim(y,m), r=rng(U.seed*7919), all=units(), load={}, tl={}, last={};
 const cols=D.tasks.map(x=>({nl:x.nl,en:x.en||x.nl,ar:x.ar||x.nl,n:x.n,g:x.g}));
 const group=g=>D.rooms.filter(x=>x.g===g).map(x=>x.u);
 const slotTask=[],pools=[];
 cols.forEach((c,i)=>{const pool=(c.g&&c.g!=="alle")?group(c.g):all;for(let k=0;k<c.n;k++){slotTask.push(i);pools.push(pool);}});
 all.forEach(u=>{load[u]=0;tl[u]=cols.map(()=>0);last[u]=-9;});
 // Fill the narrowest pools (kitchens) first so shared places can balance the load.
 const order=slotTask.map((_,s)=>s).sort((a,b)=>pools[a].length-pools[b].length);
 const days={};
 for(let d=1;d<=n;d++){const w=wdOf(y,m,d), rowv=slotTask.map(()=>""), used=new Set();
  for(const s of order){
   const cands=pools[s].filter(u=>!used.has(u)&&!(D.unav[u]||[]).includes(w));
   let best=null,bs=1e9;
   for(const u of cands){const sc=load[u]*10+tl[u][slotTask[s]]*4+(last[u]===d-1?25:0)+r()*3;if(sc<bs){bs=sc;best=u;}}
   if(!best)best=pools[s].find(u=>!used.has(u))||"";
   rowv[s]=best;if(best){used.add(best);load[best]++;tl[best][slotTask[s]]++;}
  }
  used.forEach(u=>last[u]=d);days[d]=rowv;}
 let conf=0,inrow=0;
 for(let d=1;d<=n;d++){days[d].forEach(u=>{if(u&&(D.unav[u]||[]).includes(wdOf(y,m,d)))conf++;});if(d>1)new Set(days[d].filter(Boolean)).forEach(u=>{if(days[d-1].includes(u))inrow++;});}
 const vals=Object.values(load);
 U.gen={key,days,cols,load,conf,inrow,min:vals.length?Math.min(...vals):0,max:vals.length?Math.max(...vals):0};
}
function waText(key,days,cols){
 const L=[`*${t("app")} ${D.location}, ${D.floor}, ${monthName(key)}*`], Y=lay(cols);
 if(D.url)L.push(`${t("waLink")} ${D.url}`);
 L.push("");
 Object.keys(days).map(Number).sort((a,b)=>a-b).forEach(d=>{L.push(`*${fmt(d,key)}*`);
  cols.forEach((c,i)=>L.push(`${label(c)}: ${days[d].slice(Y.st[i],Y.st[i]+c.n).filter(Boolean).join(" + ")}`));L.push("");});
 return L.join("\n");
}
function tomorrowText(){
 const T=D.today; if(D.key!==T.key||!D.days[T.day+1])return "";
 const d=T.day+1, L=[`*${t("tomorrowHead")}: ${fmt(d)}*`];
 D.cols.forEach((c,i)=>L.push(`${label(c)}: ${row(d).slice(LAY.st[i],LAY.st[i]+c.n).filter(Boolean).join(" + ")}`));
 if(D.url)L.push("",`${t("waLink")} ${D.url}`);
 return L.join("\n");
}
// The invitation is always in all three languages: the WhatsApp group is mixed.
function inviteText(){
 const url=D.url||"[link]";
 return [`🧹 *Schoonmaakrooster ${D.location}*`,"",
  "🇳🇱 Bekijk je beurten, geef door op welke dagen je niet kunt schoonmaken en ruil zelf een beurt met een andere kamer. Geef je dagen door vóór de 20e.",url,"",
  "🇬🇧 See your turns, tell us which days you can't clean, and swap a turn with another room yourself. Please report your days before the 20th.",url,"",
  "العربية: شاهد أدوارك، وأبلغنا بالأيام التي لا تستطيع فيها التنظيف، وبدّل دورك مع غرفة أخرى بنفسك. يرجى الإبلاغ عن أيامك قبل يوم 20.",url].join("\n");
}
function step(n,title,desc,body,done){
 return `<li class="step ${done?"done":""}"><div class="num" aria-hidden="true">${done?"✓":n}</div><div class="stepbody"><div class="steptop"><h3>${esc(title)}</h3>${done?chip("ok",t("doneChip")):""}</div>
 <p class="small muted">${esc(desc)}</p>${body}</div></li>`;
}
function settingsPanel(){
 // Drafts belong to one floor; start fresh when the floor shown changes.
 if(U.editFloor!==D.floor){U.editTasks=null;U.editRooms=null;U.editFloor=D.floor;}
 if(!U.editTasks)U.editTasks=D.tasks.map(x=>({...x}));
 if(!U.editRooms)U.editRooms=D.rooms.map(x=>({...x}));
 const groups=Array.from(new Set(U.editRooms.map(r=>r.g).filter(Boolean))).sort();
 const tg=(i,g)=>`<select data-et="${i}:g"><option value="alle" ${g==="alle"?"selected":""}>${esc(t("everyone"))}</option>${groups.map(x=>`<option value="${esc(x)}" ${g===x?"selected":""}>${esc(t("groupN",{g:x}))}</option>`).join("")}</select>`;
 const places=`<div class="tablewrap"><table class="edit"><thead><tr><th>${esc(t("placeName"))}</th><th>${esc(t("nameEn"))}</th><th>${esc(t("nameAr"))}</th><th>${esc(t("perTurn"))}</th><th>${esc(t("who"))}</th><th></th></tr></thead><tbody>
  ${U.editTasks.map((x,i)=>`<tr><td><input data-et="${i}:nl" value="${esc(x.nl)}" aria-label="${esc(t("placeName"))}"></td><td><input data-et="${i}:en" value="${esc(x.en)}" aria-label="${esc(t("nameEn"))}"></td><td><input data-et="${i}:ar" value="${esc(x.ar)}" dir="rtl" aria-label="${esc(t("nameAr"))}"></td>
  <td><select data-et="${i}:n">${[1,2,3,4].map(n=>`<option ${+x.n===n?"selected":""}>${n}</option>`).join("")}</select></td><td>${tg(i,x.g)}</td><td><button class="btn ghost" data-act="deltask" data-i="${i}">${esc(t("remove"))}</button></td></tr>`).join("")}
  </tbody></table></div><div class="actions start"><button class="btn" data-act="addtask">${esc(t("addPlace"))}</button><button class="btn primary" data-act="savetasks" ${U.busy?"disabled":""}>${esc(t("save"))}</button></div>`;
 const rooms=`<p class="small muted">${esc(t("groupHint"))}</p><datalist id="groups">${groups.map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
  <div class="tablewrap"><table class="edit"><thead><tr><th>${esc(t("roomCode"))}</th><th>${esc(t("group"))}</th><th></th></tr></thead><tbody>
  ${U.editRooms.map((x,i)=>`<tr><td><input data-er="${i}:u" value="${esc(x.u)}" dir="ltr" aria-label="${esc(t("roomCode"))}"></td><td><input data-er="${i}:g" value="${esc(x.g)}" list="groups" dir="ltr" class="short" aria-label="${esc(t("group"))}"></td><td><button class="btn ghost" data-act="delroom" data-i="${i}">${esc(t("remove"))}</button></td></tr>`).join("")}
  </tbody></table></div><div class="actions start"><button class="btn" data-act="addroom">${esc(t("addRoom"))}</button><button class="btn primary" data-act="saverooms" ${U.busy?"disabled":""}>${esc(t("save"))}</button></div>
  <div class="bulk"><label for="bulk" class="small"><strong>${esc(t("bulkT"))}</strong><br><span class="muted">${esc(t("bulkHint"))}</span></label><textarea id="bulk" dir="ltr" rows="4"></textarea><div class="actions start"><button class="btn" data-act="bulkadd">${esc(t("bulkAdd"))}</button></div></div>`;
 const floors=`<p class="small muted">${esc(t("floorsHint"))}</p><ul class="unav">${D.floors.map(f=>`<li><strong>${esc(f)}</strong> <span class="small muted">${D.allRooms.filter(r=>r.f===f).length} ${esc(t("roomsT").toLowerCase())}</span>${D.floors.length>1?`<button class="btn ghost" data-act="delfloor" data-v="${esc(f)}">${esc(t("remove"))}</button>`:""}</li>`).join("")}</ul>
  <div class="roompick"><input id="newfloor" placeholder="${esc(t("newFloor"))}" aria-label="${esc(t("addFloor"))}"><button class="btn primary" data-act="addfloor" ${U.busy?"disabled":""}>${esc(t("addFloor"))}</button></div>`;
 return `<section class="panel"><h2>${esc(t("setT"))}</h2><p class="small muted">${esc(t("setD"))}</p>
 <details class="help" ${U.openSet==="floors"?"open":""} data-set="floors"><summary>${esc(t("floorsT"))} (${D.floors.length})</summary>${floors}</details>
 <details class="help" ${U.openSet==="places"?"open":""} data-set="places"><summary>${esc(t("placesOn",{floor:D.floor}))} (${U.editTasks.length})</summary>${places}</details>
 <details class="help" ${U.openSet==="rooms"?"open":""} data-set="rooms"><summary>${esc(t("roomsOn",{floor:D.floor}))} (${U.editRooms.length})</summary>${rooms}</details></section>`;
}
function viewStaff(){
 if(!U.staff)return `<section class="panel narrow"><h2>${esc(t("tabStaff"))}</h2><p class="small muted">${esc(t("staffIntro"))}</p>
  <form id="login" class="roompick"><label for="code" class="eyebrow">${esc(t("code"))}</label>
  <input id="code" inputmode="numeric" autocomplete="off" value="${esc(U.code)}"><button class="btn primary" type="submit" ${U.busy?"disabled":""}>${esc(t("unlock"))}</button></form>
  <p class="small muted">${esc(t("codeHint"))}</p></section>`;
 const key=targetKey(), mon=monthName(key), all=units(), resp=(D.responded||[]).filter(u=>all.includes(u)), notResp=all.filter(u=>!resp.includes(u));
 const published=D.months.includes(key), g=U.gen&&U.gen.key===key?U.gen:null;

 const s1=`<div class="actions start"><button class="btn primary" data-act="invite">${esc(t("copyInvite"))}</button></div>
  <details class="help"><summary>${esc(t("showText"))}</summary><pre class="invite" dir="auto">${esc(inviteText())}</pre></details>`;
 const pct=all.length?Math.round(resp.length/all.length*100):0;
 const s2=`<p><strong>${esc(t("responded",{n:resp.length,total:all.length}))}</strong></p><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
  ${resp.length?`<ul class="unav">${resp.slice().sort().map(u=>{const ds=D.unav[u]||[];return `<li>${plate(u)} ${ds.length?ds.slice().sort().map(i=>chip("warn",WD[P.lang][i])).join(""):chip("ok",t("anyDay"))}</li>`;}).join("")}</ul>`:""}
  ${notResp.length?`<p class="small muted">${esc(t("notYet"))}</p><div class="loads">${notResp.map(plate).join(" ")}</div>`:""}`;
 const s3=`<div class="actions start"><button class="btn ${g?"":"primary"}" data-act="gen">${esc(g?t("regen"):t("gen"))}</button></div>
  ${g?`<div class="stats"><div class="stat ${g.conf?"bad":"good"}"><div class="small muted">${esc(t("conflicts"))}</div><div class="n">${g.conf}</div><div class="small muted">${esc(t("confHint"))}</div></div>
  <div class="stat"><div class="small muted">${esc(t("range"))}</div><div class="n" dir="ltr">${g.min}–${g.max}</div><div class="small muted">${esc(t("rangeHint"))}</div></div>
  <div class="stat"><div class="small muted">${esc(t("inrow"))}</div><div class="n">${g.inrow}</div><div class="small muted">${esc(t("inrowHint"))}</div></div></div>
  ${table(key,g.days,g.cols,{})}
  <details class="help"><summary>${esc(t("perRoom"))}</summary><div class="loads">${all.map(u=>`<span class="load">${code(u)} <b>${g.load[u]}</b></span>`).join("")}</div></details>`:""}
  <details class="help"><summary>${esc(t("rulesTitle"))}</summary><ul class="rules small">${["r1","r2","r3","r4"].map(k=>`<li>${esc(t(k))}</li>`).join("")}</ul></details>`;
 let s4;
 if(U.justPublished===key)s4=`<p class="okline">${esc(t("published",{month:mon}))}</p><div class="actions start"><button class="btn primary" data-act="copypub">${esc(t("copy"))}</button></div><textarea id="watext" hidden readonly></textarea>`;
 else if(!g)s4=published?`<p class="small">${chip("ok",t("exists",{month:mon}))}</p><div class="actions start"><button class="btn" data-act="copypub">${esc(t("copy"))}</button></div><textarea id="watext" hidden readonly></textarea>`:`<p class="empty">${esc(t("genFirst"))}</p>`;
 else if(U.confirmPub)s4=`<div class="confirm"><p><strong>${esc(t("confirmPub"))}</strong></p><div class="actions start"><button class="btn primary" data-act="publish" ${U.busy?"disabled":""}>${esc(t("yesPub"))}</button><button class="btn ghost" data-act="cancelpub">${esc(t("cancel"))}</button></div></div>`;
 else s4=`${published?`<p class="small">${chip("warn",t("exists",{month:mon}))}</p>`:""}<div class="actions start"><button class="btn primary" data-act="askpub">${esc(t("publish",{month:mon}))}</button></div>`;

 const log=D.log||[];
 const logHtml=log.length?`<ul class="swaplog">${log.map(x=>`<li>${plate(x.unit)} ⇄ ${plate(x.taker)} <span class="small muted">${esc(taskName(x.s))} ${esc(fmt(x.d))} ↔ ${esc(taskName(x.s2))} ${esc(fmt(x.d2))}</span></li>`).join("")}</ul>`:`<p class="empty">${esc(t("noSwaps"))}</p>`;

 return `<section class="panel"><div class="roompick"><label for="floorsel" class="eyebrow">${esc(t("floorPick"))}</label><select id="floorsel">${D.floors.map(f=>`<option ${f===D.floor?"selected":""}>${esc(f)}</option>`).join("")}</select></div><div class="steptop"><p>${esc(t("staffIntro"))}</p><div class="actions">${U.sheetUrl?`<a class="btn" href="${esc(U.sheetUrl)}" target="_blank" rel="noopener">${esc(t("openSheet"))}</a>`:""}<button class="btn ghost" data-act="logout">${esc(t("logout"))}</button></div></div></section>
 <ol class="steps">
  ${step(1,t("s1t"),t("s1d"),s1,false)}
  ${step(2,t("s2t"),t("s2d"),s2,!notResp.length)}
  ${step(3,t("s3t",{month:mon}),t("s3d"),s3,!!g||published)}
  ${step(4,t("s4t"),t("s4d"),s4,published)}
 </ol>
 <section class="panel"><h2>${esc(t("dailyT"))}</h2><p class="small muted">${esc(t("dailyD"))}</p><div class="actions start"><button class="btn" data-act="copytomorrow">${esc(t("copyTomorrow"))}</button></div><textarea id="watext2" hidden readonly></textarea></section>
 ${settingsPanel()}
 <section class="panel"><h2>${esc(t("swapsT",{month:monthName(D.key)}))}</h2><p class="small muted">${esc(t("swapsD"))}</p>${logHtml}${D.reqs.length?`<p class="small">${chip("mark",t("openCount",{n:D.reqs.length}))}</p>`:""}</section>`;
}

function render(){
 document.documentElement.lang=P.lang;document.documentElement.dir=P.lang==="ar"?"rtl":"ltr";
 const app=document.getElementById("app");
 if(!D){app.innerHTML=`<header><div><div class="eyebrow">Demo</div><h1>${esc(t("app"))}</h1></div></header><p class="empty">${esc(t("loading"))}</p>`;return;}
 LAY=lay(D.cols);
 if(P.room&&!D.allRooms.some(r=>r.u===P.room))P.room="";
 app.innerHTML=header()+(P.view==="mine"?viewMine():P.view==="all"?viewAll():viewStaff());
 app.classList.toggle("busy",U.busy);
 savePrefs();
}
function copyText(txt,okMsg,taId){
 const ta=document.getElementById(taId||"watext");
 const fallback=()=>{if(ta){ta.value=txt;ta.hidden=false;ta.focus();ta.select();}toast(t("copyFail"));};
 try{navigator.clipboard.writeText(txt).then(()=>toast(okMsg||t("copied")),fallback);}catch(err){fallback();}
}
async function unlock(codeVal,silent){
 let url="";
 try{url=await call("checkStaff",codeVal);}catch(e){}
 if(url){U.staff=true;U.code=codeVal;U.sheetUrl=url;try{localStorage.setItem("rooster1e-staff",codeVal);}catch(e){}}
 else if(!silent)toast(t("e_auth"));
 render();
}

// Settings inputs update the draft in place, without re-rendering, so typing keeps focus.
function editField(e){const el=e.target;const k=el.dataset.et||el.dataset.er;if(!k)return;const [i,f]=k.split(":");const list=el.dataset.et?U.editTasks:U.editRooms;if(list&&list[+i])list[+i][f]=f==="n"?+el.value:el.value;}
document.addEventListener("input",editField);
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.set)U.openSet=d.open?d.dataset.set:(U.openSet===d.dataset.set?null:U.openSet);},true);
async function switchFloor(f){P.floor=f;P.key="";U.open=null;U.pickD=null;U.gen=null;U.editTasks=null;U.editRooms=null;U.confirmPub=false;U.justPublished=null;await act("getState",[f,""]);P.key=D.key;}
document.addEventListener("change",async e=>{editField(e);
 if(e.target.id==="room"){P.room=e.target.value;P.view="mine";U.open=null;U.pickD=null;const r=D.allRooms.find(x=>x.u===P.room);if(r&&r.f!==D.floor)await switchFloor(r.f);else render();}
 if(e.target.id==="floorsel")await switchFloor(e.target.value);});
document.addEventListener("submit",async e=>{if(e.target.id!=="login")return;e.preventDefault();
 const v=document.getElementById("code").value.trim();U.busy=true;render();await unlock(v,false);U.busy=false;render();});
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;
 if(a==="lang"){P.lang=v;render();}
 else if(a==="view"){P.view=v;U.open=null;render();}
 else if(a==="month"){const k=D.months[+v];if(!k)return;P.key=k;U.open=null;await act("getState",[D.floor,k]);}
 else if(a==="gomonth"){P.key=v;U.open=null;await act("getState",[D.floor,v]);}
 else if(a==="unav"||a==="anyday"){const arr=D.unav[P.room]||[];let next=[];
   if(a==="unav"){const i=+v;next=arr.includes(i)?arr.filter(x=>x!==i):[...arr,i];}
   D.unav[P.room]=next;render();
   await act("setUnavail",[P.room,next],res=>{D.unav=res;D.responded=Array.from(new Set([...(D.responded||[]),P.room]));});}
 else if(a==="ask"){if(await act("requestSwap",[D.floor,D.key,P.room,+b.dataset.d,+b.dataset.s]))toast(t("askedToast"));}
 else if(a==="withdraw"){if(await act("withdrawSwap",[D.floor,D.key,b.dataset.id,P.room]))toast(t("withdrawnToast"));}
 else if(a==="take"){U.open=b.dataset.id||null;U.pickD=null;render();}
 else if(a==="pickd"){U.pickD=v;render();}
 else if(a==="confirm"){const [d2,s2]=U.pickD.split("-").map(Number);
   const ok=await act("acceptSwap",[D.floor,D.key,b.dataset.id,P.room,d2,s2]);if(ok){U.open=null;U.pickD=null;render();toast(t("done"));}}
 else if(a==="gen"){if(U.gen)U.seed++;generate();U.confirmPub=false;U.justPublished=null;render();}
 else if(a==="askpub"){U.confirmPub=true;render();}
 else if(a==="cancelpub"){U.confirmPub=false;render();}
 else if(a==="publish"){const g=U.gen;const ok=await act("publishMonth",[U.code,D.floor,g.key,g.days]);
   if(ok){U.confirmPub=false;U.justPublished=g.key;P.key=g.key;render();}}
 else if(a==="copypub"){const key=targetKey();
   if(D.key===key)copyText(waText(key,D.days,D.cols));
   else if(U.gen&&U.gen.key===key)copyText(waText(key,U.gen.days,U.gen.cols));
   else{P.key=key;if(await act("getState",[D.floor,key]))copyText(waText(key,D.days,D.cols));}}
 else if(a==="invite")copyText(inviteText(),t("inviteCopied"));
 else if(a==="copytomorrow"){const txt=tomorrowText();if(!txt)toast(t("noTomorrow"));else copyText(txt,t("copied"),"watext2");}
 else if(a==="addtask"){U.editTasks.push({nl:"",en:"",ar:"",n:1,g:"alle"});U.openSet="places";render();}
 else if(a==="deltask"){U.editTasks.splice(+b.dataset.i,1);U.openSet="places";render();}
 else if(a==="bulkadd"){const lines=(document.getElementById("bulk").value||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let n=0;
   lines.forEach(l=>{const p=l.split(/[\s;,\t]+/);const u=p[0];if(!u||U.editRooms.some(r=>r.u===u))return;U.editRooms.push({u,g:p[1]||""});n++;});U.openSet="rooms";render();toast(t("bulkDone",{n}));}
 else if(a==="addfloor"){const name=(document.getElementById("newfloor").value||"").trim();if(!name)return;U.openSet="floors";
   if(await act("addFloor",[U.code,name])){P.floor=D.floor;P.key=D.key;U.editTasks=null;U.editRooms=null;U.gen=null;toast(t("savedOk"));render();}}
 else if(a==="delfloor"){U.openSet="floors";if(await act("removeFloor",[U.code,v])){P.floor=D.floor;P.key=D.key;U.editTasks=null;U.editRooms=null;U.gen=null;toast(t("savedOk"));render();}}
 else if(a==="addroom"){U.editRooms.push({u:"",g:""});U.openSet="rooms";render();}
 else if(a==="delroom"){U.editRooms.splice(+b.dataset.i,1);U.openSet="rooms";render();}
 else if(a==="savetasks"){U.openSet="places";if(await act("saveTasks",[U.code,D.floor,D.key,U.editTasks])){U.editTasks=null;U.gen=null;toast(t("savedOk"));render();}}
 else if(a==="saverooms"){U.openSet="rooms";if(await act("saveRooms",[U.code,D.floor,D.key,U.editRooms])){U.editRooms=null;U.gen=null;toast(t("savedOk"));render();}}
 else if(a==="logout"){U.staff=false;U.code="";U.sheetUrl="";try{localStorage.removeItem("rooster1e-staff");}catch(_){}render();}
});

render();
call("getState",P.floor||"",P.key||"").then(async res=>{D=res;
  // A resident's room decides their floor.
  const mine=P.room&&D.allRooms.find(r=>r.u===P.room);
  if(mine&&mine.f!==D.floor){try{D=await call("getState",mine.f,"");}catch(_){}}
  P.floor=D.floor;P.key=D.key;render();if(U.code)unlock(U.code,true);})
 .catch(e=>{document.getElementById("app").insertAdjacentHTML("beforeend",`<p class="empty">${esc(errMsg(e).text)}</p>`);});
})();

</script>
</body>
